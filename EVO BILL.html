<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVO BILL</title>
  <style>
    :root {
      --accent: #ff7a00;
      --accent2: #ff9533;
      --accent-dim: rgba(255, 122, 0, .14);
      --bg: #0b0b0d;
      --side: #121214;
      --card: #18181b;
      --card2: #1f1f23;
      --text: #f4f4f5;
      --muted: #9a9aa3;
      --line: #2b2b31;
      --green: #3ddc84;
      --red: #ff5d5d;
      --orange: #ff7a00;
      --side-w: 236px;
      --accent3: #ff4d00;
      --glow: rgba(255, 122, 0, .16);
      --glow2: rgba(255, 77, 0, .08);
      --input: #101012;
      --bord: #3a3a42;
      --btnl: #2b2b31;
      --on-accent: #111;
      --navtxt: #c9c9d0
    }

    * {
      box-sizing: border-box
    }

    html {
      color-scheme: dark
    }

    html[data-theme=light] {
      color-scheme: light
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    /* ---------- Sidebar menu ---------- */
    aside {
      width: var(--side-w);
      background: var(--side);
      border-right: 1px solid var(--line);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      z-index: 5;
      overflow-y: auto
    }

    .brand {
      padding: 6px 8px 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
      align-items: center
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #ff4d00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 800;
      color: #111;
      flex: none
    }

    .brand b {
      font-size: 20px;
      letter-spacing: .06em;
      font-weight: 800;
      display: block;
      line-height: 1.15;
      color: #fff
    }

    .brand span {
      font-size: 12px;
      color: var(--muted)
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1
    }

    nav button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-left: 3px solid transparent;
      color: var(--navtxt);
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600
    }

    nav button .ic {
      font-size: 19px;
      width: 24px;
      text-align: center;
      flex: none
    }

    nav button:hover {
      background: var(--card2);
      color: var(--text)
    }

    nav button.on {
      background: var(--accent-dim);
      color: var(--accent2);
      border-left-color: var(--accent)
    }

    .hbtns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      margin-top: 12px
    }

    .hbtns .btn {
      width: 100%;
      padding: 10px
    }

    main {
      margin-left: var(--side-w);
      flex: 1;
      min-width: 0;
      max-width: 1250px;
      padding: 22px 22px 60px
    }

    h2 {
      margin: 0 0 16px;
      font-size: 23px;
      padding-left: 12px;
      border-left: 4px solid var(--accent)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 16px
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: 12px;
      padding: 16px
    }

    .stat small {
      color: var(--muted);
      display: block;
      margin-bottom: 4px
    }

    .stat b {
      font-size: 23px
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--accent2);
      letter-spacing: .05em;
      background: var(--card2)
    }

    tbody tr:hover td {
      background: rgba(255, 255, 255, .025)
    }

    td.r,
    th.r {
      text-align: right
    }

    .btn {
      background: var(--accent);
      color: var(--on-accent);
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700
    }

    .btn:hover {
      filter: brightness(1.12)
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: 13px
    }

    .btn.g {
      background: #22a861;
      color: #fff
    }

    .btn.o {
      background: var(--btnl);
      color: var(--accent2);
      border: 1px solid var(--accent)
    }

    .btn.d {
      background: #c93a3a;
      color: #fff
    }

    .btn.l {
      background: var(--btnl);
      color: var(--text)
    }

    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px
    }

    .bar input,
    .bar select {
      padding: 9px;
      border: 1px solid var(--bord);
      border-radius: 8px;
      font-size: 14px;
      background: var(--input);
      color: var(--text)
    }

    .bar .grow {
      flex: 1;
      min-width: 180px
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 14px
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 0;
      border-color: var(--accent) !important
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 10px;
      overflow: auto;
      z-index: 20
    }

    .modal.hidden {
      display: none
    }

    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 860px
    }

    .box h3 {
      margin: 0 0 14px;
      color: var(--accent2)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600
    }

    label input,
    label select,
    label textarea {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 9px;
      border: 1px solid var(--bord);
      border-radius: 8px;
      background: var(--input);
      color: var(--text);
      font-weight: 400
    }

    .lines input {
      width: 100%;
      padding: 7px;
      border: 1px solid var(--bord);
      border-radius: 6px;
      background: var(--input);
      color: var(--text)
    }

    .lines td {
      padding: 4px
    }

    .x {
      background: none;
      border: 0;
      color: var(--red);
      cursor: pointer;
      font-size: 16px
    }

    .tot {
      margin-left: auto;
      width: 290px;
      margin-top: 12px
    }

    .tot div {
      display: flex;
      justify-content: space-between;
      padding: 4px 0
    }

    .tot .big {
      font-size: 18px;
      font-weight: 700;
      border-top: 2px solid var(--accent);
      margin-top: 4px;
      padding-top: 8px;
      color: var(--accent2)
    }

    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
      flex-wrap: wrap
    }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700
    }

    .t-paid {
      background: rgba(61, 220, 132, .16);
      color: #3ddc84
    }

    .t-due {
      background: rgba(255, 93, 93, .16);
      color: #ff7b7b
    }

    .t-part {
      background: rgba(255, 149, 51, .18);
      color: #ffb066
    }

    .muted {
      color: var(--muted)
    }

    .note {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffc58a;
      margin-bottom: 14px
    }

    .pos {
      color: var(--red);
      font-weight: 700
    }

    .neg {
      color: var(--green);
      font-weight: 700
    }

    #printArea {
      display: none
    }

    .inv.pv {
      padding: 0;
      font-size: 12px
    }

    .inv.pv h3.ti {
      text-align: center;
      margin: 0 0 6px;
      font-size: 15px
    }

    .inv.pv table {
      width: 100%;
      border-collapse: collapse;
      border: 0;
      margin: 0
    }

    .inv.pv table+table {
      margin-top: -1px
    }

    .inv.pv td,
    .inv.pv th {
      border: 1px solid #777;
      padding: 5px 7px;
      vertical-align: top;
      color: #000;
      background: #fff;
      font-size: 12px;
      text-align: left
    }

    .inv.pv th {
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px
    }

    .inv.pv .rt,
    .inv.pv th.rt {
      text-align: right
    }

    .inv.pv table.in td {
      border: 0;
      border-bottom: 1px solid #ddd
    }

    @page {
      size: A4;
      margin: 8mm
    }

    .inv {
      font-family: Arial, sans-serif;
      color: #000;
      padding: 10px;
      background: #fff
    }

    .inv h1 {
      margin: 0;
      font-size: 26px
    }

    .inv .hd {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
      margin-bottom: 10px
    }

    .inv table th {
      background: #eee;
      color: #000
    }

    .inv table td,
    .inv table th {
      border: 1px solid #999;
      padding: 6px;
      background: transparent;
      color: #000
    }

    .inv .ft {
      display: flex;
      justify-content: space-between;
      margin-top: 30px
    }

    @media print {
      body {
        background: #fff !important
      }

      body>*:not(#printArea) {
        display: none !important
      }

      #printArea {
        display: block !important
      }
    }

    /* ---------- Mobile: menu becomes bottom bar ---------- */
    @media(max-width:1px) {
      aside {
        top: auto;
        width: 100%;
        height: auto;
        flex-direction: row;
        padding: 6px;
        border-right: 0;
        border-top: 1px solid var(--line);
        overflow-x: auto;
        overflow-y: hidden
      }

      .brand,
      .hbtns {
        display: none
      }

      nav {
        flex-direction: row;
        gap: 4px;
        flex: none
      }

      nav button {
        flex-direction: column;
        gap: 2px;
        width: auto;
        min-width: 74px;
        padding: 7px 8px;
        font-size: 11px;
        text-align: center;
        border-left: 0;
        border-top: 3px solid transparent;
        border-radius: 8px
      }

      nav button.on {
        border-left: 0;
        border-top-color: var(--accent)
      }

      main {
        margin-left: 0;
        padding: 14px 12px 100px
      }

      .tot {
        width: 100%
      }

      th,
      td {
        padding: 7px 4px;
        font-size: 13px
      }
    }

    /* ---------- Themes ---------- */
    html[data-theme=midnight] {
      --accent: #06b6d4;
      --accent2: #67e8f9;
      --accent3: #3b82f6;
      --accent-dim: rgba(34, 211, 238, .14);
      --glow: rgba(34, 211, 238, .15);
      --glow2: rgba(59, 130, 246, .10);
      --bg: #070b16;
      --side: #0d1424;
      --card: #111a2e;
      --card2: #172238;
      --text: #eef4ff;
      --muted: #8fa0bd;
      --line: #223152;
      --input: #0a1120;
      --bord: #2c3d63;
      --btnl: #1c2a47;
      --on-accent: #04141a;
      --navtxt: #b6c4de
    }

    html[data-theme=violet] {
      --accent: #8b5cf6;
      --accent2: #c4b5fd;
      --accent3: #ec4899;
      --accent-dim: rgba(139, 92, 246, .16);
      --glow: rgba(139, 92, 246, .18);
      --glow2: rgba(236, 72, 153, .09);
      --bg: #0c0916;
      --side: #130f21;
      --card: #181330;
      --card2: #20193d;
      --text: #f5f3ff;
      --muted: #a59cc7;
      --line: #2d2550;
      --input: #0e0a1c;
      --bord: #3b3162;
      --btnl: #271f47;
      --on-accent: #fff;
      --navtxt: #cfc8ea
    }

    html[data-theme=forest] {
      --accent: #10b981;
      --accent2: #6ee7b7;
      --accent3: #84cc16;
      --accent-dim: rgba(16, 185, 129, .15);
      --glow: rgba(16, 185, 129, .16);
      --glow2: rgba(132, 204, 22, .08);
      --bg: #06100c;
      --side: #0b1a14;
      --card: #0f2119;
      --card2: #152b21;
      --text: #ecfdf5;
      --muted: #8fb5a3;
      --line: #1f3a2e;
      --input: #08140f;
      --bord: #2b4d3d;
      --btnl: #1a3326;
      --on-accent: #031a10;
      --navtxt: #b4d4c4
    }

    html[data-theme=light] {
      --accent: #ea580c;
      --accent2: #c2410c;
      --accent3: #f59e0b;
      --accent-dim: rgba(234, 88, 12, .10);
      --glow: rgba(234, 88, 12, .16);
      --glow2: rgba(245, 158, 11, .12);
      --bg: #f6f3ee;
      --side: #ffffff;
      --card: #ffffff;
      --card2: #faf7f2;
      --text: #1c1917;
      --muted: #78716c;
      --line: #e7e0d6;
      --input: #ffffff;
      --bord: #d6cdbf;
      --btnl: #ece6dc;
      --on-accent: #fff;
      --navtxt: #57534e;
      --green: #15803d;
      --red: #b91c1c
    }

    html[data-theme=light] .t-paid {
      background: #dcfce7;
      color: #166534
    }

    html[data-theme=light] .t-due {
      background: #fee2e2;
      color: #991b1b
    }

    html[data-theme=light] .t-part {
      background: #fef3c7;
      color: #92400e
    }

    html[data-theme=light] .note {
      color: #9a3412
    }

    html[data-theme=light] aside,
    html[data-theme=light] .card,
    html[data-theme=light] .stat {
      box-shadow: 0 8px 28px rgba(120, 90, 50, .12) !important
    }

    html[data-theme=light] .modal {
      background: rgba(40, 30, 20, .45)
    }

    /* ---------- Unique design ---------- */
    body {
      background: radial-gradient(900px 480px at 88% -8%, var(--glow), transparent 62%), radial-gradient(700px 520px at -8% 108%, var(--glow2), transparent 60%), var(--bg);
      background-attachment: fixed
    }

    aside {
      top: 12px;
      bottom: 12px;
      left: 12px;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35)
    }

    main {
      margin-left: calc(var(--side-w) + 30px);
      padding-top: 28px
    }

    .logo {
      border-radius: 15px;
      box-shadow: 0 0 20px var(--glow);
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      color: var(--on-accent)
    }

    .brand {
      border-bottom: 0;
      padding-bottom: 10px
    }

    .brand b {
      color: var(--text)
    }

    .brand span {
      display: block;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    nav button {
      border-left: 0;
      border-radius: 999px;
      padding: 11px 16px;
      transition: .15s
    }

    nav button:hover {
      transform: translateX(3px)
    }

    nav button.on {
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      color: var(--on-accent);
      box-shadow: 0 8px 20px var(--glow);
      transform: none
    }

    h2 {
      border: 0;
      padding: 0;
      margin-bottom: 20px;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.01em
    }

    h2::after {
      content: "";
      display: block;
      width: 48px;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      margin-top: 7px
    }

    .card {
      border-radius: 22px;
      background: linear-gradient(180deg, var(--card2), var(--card));
      box-shadow: 0 8px 26px rgba(0, 0, 0, .2)
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      padding: 18px 18px 18px 24px;
      background: linear-gradient(145deg, var(--card2), var(--card))
    }

    .stat::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(var(--accent), var(--accent3))
    }

    .stat small {
      text-transform: uppercase;
      letter-spacing: .07em;
      font-size: 11px;
      font-weight: 700
    }

    .stat b {
      font-size: 27px;
      letter-spacing: -.01em
    }

    .btn {
      border-radius: 999px;
      padding: 9px 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      box-shadow: 0 4px 14px var(--glow)
    }

    .btn.sm {
      padding: 5px 12px
    }

    .btn.g,
    .btn.d,
    .btn.o,
    .btn.l {
      box-shadow: none
    }

    .btn.g {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff
    }

    .btn.d {
      background: linear-gradient(135deg, #dc2626, #f43f5e);
      color: #fff
    }

    th {
      background: transparent;
      border-bottom: 2px solid var(--accent);
      color: var(--muted);
      font-weight: 700
    }

    td {
      border-bottom: 1px solid var(--line)
    }

    .bar input,
    .bar select,
    label input,
    label select,
    label textarea {
      border-radius: 12px
    }

    .box {
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45)
    }

    .box::before {
      content: "";
      display: block;
      height: 5px;
      margin: -20px -20px 16px;
      border-radius: 26px 26px 0 0;
      background: linear-gradient(90deg, var(--accent), var(--accent3))
    }

    .tag {
      padding: 3px 11px
    }

    .themes {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 4px 0 2px
    }

    .themes button,
    .tsw {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--line);
      cursor: pointer;
      padding: 0
    }

    .themes button.on,
    .tsw.on {
      border-color: var(--text);
      box-shadow: 0 0 0 2px var(--bg)
    }

    .tsw {
      width: auto;
      height: auto;
      border-radius: 999px;
      padding: 8px 16px;
      color: #fff;
      font-weight: 700;
      border-width: 2px
    }

    @media(max-width:1px) {
      aside {
        left: 8px;
        right: 8px;
        bottom: 8px;
        top: auto;
        width: auto;
        border-radius: 22px;
        border: 1px solid var(--line)
      }

      nav button {
        border-radius: 14px
      }

      nav button:hover {
        transform: none
      }

      nav button.on {
        background: linear-gradient(135deg, var(--accent), var(--accent3));
        border-top-color: transparent
      }

      main {
        margin-left: 0;
        padding: 16px 12px 110px
      }

      .hbtns,
      .themes {
        display: none
      }
    }

    /* ---------- Left row menu at every screen size ---------- */
    .menubtn,
    .scrim {
      display: none
    }

    @media(max-width:1000px) {
      :root {
        --side-w: 206px
      }

      main {
        padding: 22px 16px 60px
      }

      nav button {
        padding: 10px 14px;
        font-size: 14px
      }

      .tot {
        width: 100%
      }
    }

    @media(max-width:640px) {
      .menubtn {
        display: flex;
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 30;
        width: 46px;
        height: 46px;

    /* ================= Click effects ================= */
    .btn,
    nav button,
    .tsw,
    .themes button,
    .menubtn,
    .cosel {
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent
    }

    .cosel {
      overflow: visible
    }

    .btn,
    nav button,
    .tsw,
    .themes button {
      transition: transform .12s ease, box-shadow .15s ease, background-color .2s ease, filter .15s ease
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, .18)
    }

    .btn:active {
      transform: translateY(1px) scale(.96);
      box-shadow: none;
      filter: brightness(.92)
    }

    nav button:active {
      transform: scale(.96)
    }

    .themes button:hover {
      transform: scale(1.15)
    }

    .themes button:active {
      transform: scale(.9)
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: .32;
      transform: scale(0);
      pointer-events: none;
      animation: ripple .65s ease-out forwards
    }

    @keyframes ripple {
      to {
        transform: scale(1);
        opacity: 0
      }
    }

    nav button::before {
      content: "";
      position: absolute;
      left: 0;
      top: 22%;
      bottom: 22%;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: #fff;
      transform: scaleY(0);
      transition: transform .25s cubic-bezier(.3, 1.6, .5, 1)
    }

    nav button.on::before {
      transform: scaleY(1)
    }

    nav button.on {
      animation: navpop .35s ease
    }

    nav button.on .ic {
      animation: icpop .4s cubic-bezier(.3, 1.7, .5, 1)
    }

    @keyframes navpop {
      0% {
        transform: scale(.96)
      }

      60% {
        transform: scale(1.03)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes icpop {
      0% {
        transform: scale(.6) rotate(-12deg)
      }

      100% {
        transform: scale(1) rotate(0)
      }
    }

    #main>* {

        opacity: 0;
        transform: translateY(6px)

        transform: none

        opacity: 0;
        transform: translateY(12px) scale(.98)

      to {
        opacity: 1;
        transform: none

  <script>
    "use strict";
    /* ---- Tiny offline QR encoder (byte mode, ECC level M, versions 1-25) ---- */
    function evoQRMatrix(text) {
      var ECC = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28];
      var NB = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21];
      var data = Array.prototype.slice.call(unescape(encodeURIComponent(text))).map(function (c) { return c.charCodeAt(0); });
      function raw(v) { var r = (16 * v + 128) * v + 64; if (v >= 2) { var n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; }
      function cap(v) { return Math.floor(raw(v) / 8) - ECC[v] * NB[v]; }
      var ver = 1;
      while (ver <= 25 && 4 + (ver < 10 ? 8 : 16) + 8 * data.length > cap(ver) * 8) ver++;
      if (ver > 25) throw new Error('QR text too long');
      var bits = [];
      function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
      put(4, 4); put(data.length, ver < 10 ? 8 : 16); data.forEach(function (b) { put(b, 8); });
      var cb = cap(ver) * 8;
      put(0, Math.min(4, cb - bits.length)); while (bits.length % 8) bits.push(0);
      for (var pad = 0xEC; bits.length < cb; pad ^= 0xEC ^ 0x11) put(pad, 8);
      var cw = []; for (var i = 0; i < bits.length; i += 8) { var v8 = 0; for (var j = 0; j < 8; j++) v8 = (v8 << 1) | bits[i + j]; cw.push(v8); }
      function mul(x, y) { var z = 0; for (var i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; }
      function rs(d, n) {
        var div = []; for (var i = 0; i < n - 1; i++) div.push(0); div.push(1);

    function paySum() {

    function savePayIn() {

    /* ============ Payment Reminder ============ */
    let remDays = 0;
    function dueInfo(cid) {
      const bills = dueBills(cid), bal = custBalance(cid), sum = bills.reduce((a, i) => a + invDue(i), 0);

    /* ============ Monthly graph (Dashboard) ============ */
    const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    let dashFY = '';
    function fyStart(d) { const y = +d.slice(0, 4), m = +d.slice(5, 7); return m >= 4 ? y : y - 1; }
    function fyList() {
      const set = {}, add = (d) => { if (d) set[fyStart(d)] = 1; };
      db.invoices.forEach((i) => add(i.date)); db.payments.forEach((p) => add(p.date)); db.cashbook.forEach((e) => add(e.date)); set[fyStart(today())] = 1;

    function monthlySeries(fy) {
      const rows = [], idx = {};
      for (let k = 0; k < 12; k++) { const m = (3 + k) % 12 + 1, y = fy + (m < 4 ? 1 : 0), r = { key: y + '-' + String(m).padStart(2, '0'), label: MN[m - 1], sales: 0, inn: 0, out: 0 }; rows.push(r); idx[r.key] = r; }

    function niceMax(v) { if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
    function shortMoney(v) {

    function monthlyCard() {
      const fy = dashFY ? +dashFY : fyStart(today()), rows = monthlySeries(fy);
      const W = 760, H = 290, L = 54, R = 10, T = 14, B = 30, pw = W - L - R, ph = H - T - B;
      const max = niceMax(Math.max.apply(null, rows.map((r) => Math.max(r.sales, r.inn, r.out))));
      const gw = pw / 12, bw = Math.min(16, gw * 0.26), Y = (v) => T + ph - (v / max) * ph;
      let g = '';
      for (let t = 0; t <= 4; t++) { const v = max * t / 4, y = Y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + shortMoney(v) + '</text>'; }
      const cols = [['sales', 'var(--accent)', 'Sales'], ['inn', 'var(--green)', 'Money In'], ['out', 'var(--red)', 'Money Out']];
      rows.forEach((r, k) => {
        const cx = L + gw * k + gw / 2;
        cols.forEach((c, j) => {
          const v = r[c[0]], x = cx + (j - 1) * (bw + 2) - bw / 2, y = Y(v), h = Math.max(0, T + ph - y);
          g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + c[1] + '"><title>' + r.label + ' - ' + c[2] + ': ' + money(v) + '</title></rect>';

      const leg = cols.map((c) => '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><i style="width:12px;height:12px;border-radius:3px;background:' + c[1] + ';display:inline-block"></i>' + c[2] + '</span>').join('');

        '<details style="margin-top:10px"><summary class="muted" style="cursor:pointer">Show month-wise figures</summary><table><thead><tr><th>Month</th><th class="r">Sales</th><th class="r">Money In</th><th class="r">Money Out</th></tr></thead><tbody>' +
        rows.map((r) => '<tr><td>' + r.label + ' ' + r.key.slice(0, 4) + '</td><td class="r">' + money(r.sales) + '</td><td class="r">' + money(r.inn) + '</td><td class="r">' + money(r.out) + '</td></tr>').join('') + '</tbody></table></details></div>';

    function sellerState() { const s = db.settings, g = String(s.gstin || '').trim(); return (/^\d{2}/.test(g) ? g.slice(0, 2) : '') || stCode(s.state) || '24'; }
    function gstDoc(i) {

      const t = calcLines(i.lines, i.discount), gross = t.sub + t.tax, f = gross > 0 ? Math.max(0, gross - num(i.discount)) / gross : 1;
      const items = i.lines.map((l) => { const tx = num(l.qty) * num(l.rate) * f; return { name: l.name, hsn: String(l.hsn || '').trim(), qty: num(l.qty), rate: num(l.gst), tx: tx, tax: tx * num(l.gst) / 100 }; });
      return { i: i, c: c, gstin: ok ? g : '', badGstin: !!g && !ok, pos: pos, inter: pos !== sc, items: items, tx: items.reduce((a, x) => a + x.tx, 0), tax: items.reduce((a, x) => a + x.tax, 0), val: num(i.total) };

    function gstDocs(m) { return db.invoices.filter((i) => (i.date || '').slice(0, 7) === m).map(gstDoc); }
    function clsOf(d) { return d.gstin ? 'B2B' : (d.inter && d.val > 250000 ? 'B2CL' : 'B2CS'); }
    function gstWarnings(docs) {
      const w = [], s = db.settings;

      docs.forEach((d) => {
        const n = d.i.no;
        if (!/^[A-Za-z0-9\/-]{1,16}$/.test(n)) w.push('Invoice ' + n + ': number must be max 16 characters, only letters, digits, / and -.');
        if (d.badGstin) w.push('Invoice ' + n + ': customer GSTIN "' + d.c.gstin + '" is not valid, so it is treated as B2C.');
        d.items.forEach((x) => { if (!x.hsn) w.push('Invoice ' + n + ': "' + x.name + '" has no HSN/SAC.'); });

      return w;
    }
    function hsnAgg(docs) {
      const h = {};
      docs.forEach((d) => d.items.forEach((x) => {
        const k = x.hsn + '|' + x.rate, g = h[k] || (h[k] = { hsn: x.hsn, rate: x.rate, qty: 0, tx: 0, i: 0, c: 0, s: 0 });
        g.qty += x.qty; g.tx += x.tx; if (d.inter) g.i += x.tax; else { g.c += x.tax / 2; g.s += x.tax / 2; }
      }));
      return Object.keys(h).sort().map((k) => h[k]);
    }
    function buildGstr1(m) {
      const docs = gstDocs(m), s = db.settings, p = m.split('-');
      const out = { gstin: String(s.gstin || '').trim().toUpperCase(), fp: p[1] + p[0], gt: 0, cur_gt: 0 };
      const split = (t, inter) => ({ iamt: r2(inter ? t : 0), camt: r2(inter ? 0 : t / 2), samt: r2(inter ? 0 : t / 2), csamt: 0 });
      const byRate = (d) => { const g = {}; d.items.forEach((x) => { const o = g[x.rate] || (g[x.rate] = { rt: x.rate, tx: 0, tax: 0 }); o.tx += x.tx; o.tax += x.tax; }); return Object.keys(g).map((k) => g[k]); };
      const b2b = {}, b2cl = {}, b2cs = {};

        } else {
          byRate(d).forEach((o) => { const k = d.pos + '|' + o.rt + '|' + d.inter, g = b2cs[k] || (b2cs[k] = { sply_ty: d.inter ? 'INTER' : 'INTRA', rt: o.rt, typ: 'OE', pos: d.pos, tx: 0, tax: 0 }); g.tx += o.tx; g.tax += o.tax; });
        }
      });
      if (Object.keys(b2b).length) out.b2b = Object.keys(b2b).map((k) => ({ ctin: k, inv: b2b[k] }));
      if (Object.keys(b2cl).length) out.b2cl = Object.keys(b2cl).map((k) => ({ pos: k, inv: b2cl[k] }));
      if (Object.keys(b2cs).length) out.b2cs = Object.keys(b2cs).map((k) => { const g = b2cs[k]; return Object.assign({ sply_ty: g.sply_ty, rt: g.rt, typ: g.typ, pos: g.pos, txval: r2(g.tx) }, split(g.tax, g.sply_ty === 'INTER')); });
      const hs = hsnAgg(docs);
      if (hs.length) out.hsn = { data: hs.map((g, k) => ({ num: k + 1, hsn_sc: g.hsn, desc: '', uqc: 'NOS', qty: r2(g.qty), rt: g.rate, txval: r2(g.tx), iamt: r2(g.i), camt: r2(g.c), samt: r2(g.s), csamt: 0 })) };
      if (docs.length) { const n = docs.length; out.doc_issue = { doc_det: [{ doc_num: 1, docs: [{ num: 1, from: docs[0].i.no, to: docs[n - 1].i.no, totnum: n, cancel: 0, net_issue: n }] }] }; }
      return out;
    }

    function gstJson() {

    }
    function manageCo() {
      openModal('<h3>Manage Companies</h3><div>' + companies.map((c) => '<div class="bar" style="margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:8px"><span class="grow"><b>' + esc(c.name || '(unnamed)') + '</b>' + (c.id === coId ? ' <span class="tag t-paid">Active</span>' : '') + '</span>' +
        (c.id === coId ? '' : '<button class="btn sm g" onclick="switchCompany(\'' + c.id + '\')">Open</button> ') + '<button class="btn sm" onclick="renameCo(\'' + c.id + '\')">Rename</button>' +
        (companies.length > 1 ? ' <button class="btn sm d" onclick="deleteCo(\'' + c.id + '\')">Delete</button>' : '') + '</div>').join('') + '</div>' +
        '<div class="actions"><button class="btn" onclick="newCompanyForm()">+ Add new company</button><button class="btn l" onclick="closeModal()">Close</button></div>');
    }
    function renameCo(id) {
      const c = companies.find((x) => x.id === id); if (!c) return;
      const n = prompt('Company name:', c.name); if (n === null || !n.trim()) return;
      c.name = n.trim();
      if (id === coId) { db.settings.shop = c.name; save(); }
      else { try { const o = JSON.parse(localStorage.getItem(keyFor(id))); if (o) { o.settings = o.settings || {}; o.settings.shop = c.name; localStorage.setItem(keyFor(id), JSON.stringify(o)); } } catch (e) { } }
      saveCompanies(); render(); manageCo();
    }
    function deleteCo(id) {
      const c = companies.find((x) => x.id === id); if (!c || companies.length < 2) return;
      if (!confirm('Delete company "' + c.name + '" and ALL its data?\nThis cannot be undone. Take a backup first.') || !confirm('Really delete "' + c.name + '"?')) return;
      try { localStorage.removeItem(keyFor(id)); } catch (e) { }
      companies = companies.filter((x) => x.id !== id);
      if (id === coId) loadCompany(companies[0].id); else { saveCompanies(); render(); }
      manageCo();
    }
    async function coDir() { if (coId === 'main') return dirH; const c = curCo(); return await dirH.getDirectoryHandle(c.folder || ('Company_' + coId), { create: true }); }

    /* ============ Settings ============ */
    function vSettings() {
      const s = db.settings;
      const imgBox = (key, title) => '<div class="card" style="margin:0"><b>' + title + '</b><div style="margin:10px 0;min-height:70px">' + (s[key] ? '<img src="' + s[key] + '" style="max-height:80px;max-width:100%;background:#fff;padding:4px;border-radius:6px">' : '<span class="muted">Not added</span>') + '</div>' +
        '<input type="file" accept="image/*" onchange="pickImg(\'' + key + '\',this)"> ' + (s[key] ? '<button class="btn sm d" onclick="clearImg(\'' + key + '\')">Remove</button>' : '') + '</div>';
      return '<h2>Settings</h2><div class="card"><div class="grid">' +
        '<label>Shop name<input id="sShop" value="' + esc(s.shop) + '"></label><label>Address<input id="sAddr" value="' + esc(s.addr) + '"></label>' +
        '<label>Phone<input id="sPhone" value="' + esc(s.phone) + '"></label><label>Email<input id="sEmail" value="' + esc(s.email) + '"></label>' +
        '<label>GSTIN<input id="sGst" value="' + esc(s.gstin) + '"></label><label>State (code-name)<input id="sState" value="' + esc(s.state) + '" placeholder="24-Gujarat"></label>' +
        '<label>Invoice prefix<input id="sPre" value="' + esc(s.prefix) + '" placeholder="FY26-27/"></label><label>Next invoice number<input type="number" min="1" id="sNext" value="' + s.next + '"></label>' +
        '<label>Number digits (0 = no zeros)<input type="number" min="0" max="8" id="sPad" value="' + (s.pad === undefined ? 4 : s.pad) + '"></label></div>' +
        '<b>Bank details (printed on invoice)</b><div class="grid" style="margin-top:8px">' +
        '<label>Bank name &amp; branch<input id="sBank" value="' + esc(s.bankName) + '"></label><label>Account No.<input id="sAcc" oninput="bankQrUpdate()" value="' + esc(s.bankAcc) + '"></label>' +
        '<label>IFSC code<input id="sIfsc" oninput="bankQrUpdate()" value="' + esc(s.bankIfsc) + '"></label><label>Account holder name<input id="sHolder" oninput="bankQrUpdate()" value="' + esc(s.bankHolder) + '"></label>' +
        '<label>UPI ID (auto QR on bill)<input id="sUpi" oninput="bankQrUpdate()" value="' + esc(s.upi) + '" placeholder="yourname@bank"></label>' +
        '<label>City / Place (e-way bill)<input id="sCity" value="' + esc(s.city) + '"></label><label>Pincode (e-way bill)<input id="sPin" maxlength="6" value="' + esc(s.pincode) + '"></label></div>' +
        '<div id="bankQr" class="bqr">' + bankQrHtml(payVpa(), s.bankHolder || s.shop) + '</div>' +
        '<label>Terms printed on invoice<textarea id="sTerms" rows="3">' + esc(s.terms) + '</textarea></label>' +
        '<div class="actions"><button class="btn g" onclick="saveSettings()">Save Settings</button></div></div>' +
        '<div class="card"><b>Colour theme</b><div class="bar" style="margin-top:10px">' + THEMES.map((t) => '<button class="tsw' + (theme === t[0] ? ' on' : '') + '" style="background:' + t[1] + (t[0] === 'light' ? ';color:#1c1917' : '') + '" onclick="setTheme(\'' + t[0] + '\')">' + t[2] + '</button>').join('') + '</div></div>' +
        '<div class="card"><b>Invoice images</b><p class="muted">Add your logo, UPI QR code and signature once. They print on every invoice.</p><div class="grid">' + imgBox('logo', 'Logo') + imgBox('qr', 'UPI QR code') + imgBox('sign', 'Signature') + '</div></div>' +
        '<div class="card"><b>Auto Backup to a folder on this PC</b><p id="abStat" class="muted" style="margin:8px 0 12px">' + abHtml() + '</p>' +
        '<div class="bar"><button class="btn" onclick="chooseFolder()">&#128193; ' + (dirH ? 'Change' : 'Choose') + ' backup folder</button>' + (dirH ? '<button class="btn o" onclick="allowAb()">Allow access</button><button class="btn g" onclick="backup()">Backup now</button><button class="btn l" onclick="restoreFromFolder()">Restore from folder</button>' : '') + '</div>' +
        '<p class="muted" style="margin-bottom:0">Browsers only show the folder name, not the full path. After you restart the browser it may ask permission once - click "Backup paused" in the left menu and choose Allow.</p></div>' +
        '<div class="card"><b>Backup & Restore</b><p class="muted">Your data is stored in this browser on this PC. Take a backup file regularly and copy it to a pen drive or Google Drive. Use the same file to restore on any PC.</p>' +
        '<div class="bar"><button class="btn g" onclick="backup()">&#128190; Backup now</button><button class="btn o" onclick="restorePick()">&#9851; Restore from file</button></div>' +
        '<p class="muted">Last backup: ' + (db.lastBackup ? new Date(db.lastBackup).toLocaleString() : 'never') + '</p></div>' +
        '<div class="card"><b>Danger zone</b><p class="muted">Erase everything of this company in this browser. Take a backup first.</p><button class="btn d" onclick="wipe()">Erase all data</button></div>';
    }
    function applySettings() {
      if (!$('#sShop')) return;
      Object.assign(db.settings, {
        shop: $('#sShop').value.trim(), addr: $('#sAddr').value.trim(), phone: $('#sPhone').value.trim(), email: $('#sEmail').value.trim(), gstin: $('#sGst').value.trim(), state: $('#sState').value.trim(),
        prefix: $('#sPre').value, next: Math.max(1, Math.floor(num($('#sNext').value)) || 1), pad: Math.max(0, Math.min(8, Math.floor(num($('#sPad').value)))),
        bankName: $('#sBank').value.trim(), bankAcc: $('#sAcc').value.trim(), bankIfsc: $('#sIfsc').value.trim(), bankHolder: $('#sHolder').value.trim(), upi: $('#sUpi').value.trim().replace(/\s+/g, ''), city: $('#sCity').value.trim(), pincode: $('#sPin').value.trim(), terms: $('#sTerms').value
      });
    }
    function saveSettings() { applySettings(); save(); render(); alert('Settings saved.'); }
    function pickImg(key, inp) {
      const f = inp.files[0]; if (!f) return;
      applySettings();
      const r = new FileReader();
      r.onload = function () {
        const im = new Image();
        im.onload = function () {
          const k = Math.min(1, 500 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
          cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
          const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
          db.settings[key] = cv.toDataURL('image/jpeg', 0.85); save(); render();
        };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    }
    function clearImg(key) { applySettings(); db.settings[key] = ''; save(); render(); }
    function wipe() { if (confirm('Erase ALL data? This cannot be undone.') && confirm('Are you really sure?')) { db = coId === 'main' ? defaults() : blankCompany(curCo().name); save(); go('dashboard'); } }

    /* ============ Backup / Restore ============ */
    function stamp() { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
    function download(name, text, type) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }
    /* ============ Auto backup to a folder on this PC ============ */
    const FS_OK = typeof window.showDirectoryPicker === 'function';
    let dirH = null, abState = FS_OK ? 'none' : 'nosupport', abLast = null, abErr = '', abTimer = null, abBusy = false;
    function mergeDb(d) { const r = Object.assign(defaults(), d); r.settings = Object.assign(defaults().settings, d.settings || {}); return r; }
    function idb(mode, fn) {
      return new Promise(function (res, rej) {
        const r = indexedDB.open('evo_bill_fs', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('h'); };
        r.onerror = function () { rej(r.error); };
        r.onsuccess = function () { const tx = r.result.transaction('h', mode), q = fn(tx.objectStore('h')); tx.oncomplete = function () { res(q && q.result); }; tx.onerror = function () { rej(tx.error); }; };
      });
    }
    async function permOk(ask) {
      if (!dirH) return false;
      try { let p = await dirH.queryPermission({ mode: 'readwrite' }); if (p !== 'granted' && ask) p = await dirH.requestPermission({ mode: 'readwrite' }); return p === 'granted'; } catch (e) { return false; }
    }
    async function loadDir() {
      if (!FS_OK) { updateAb(); return; }
      try { dirH = (await idb('readonly', function (st) { return st.get('dir'); })) || null; } catch (e) { dirH = null; }
      abState = dirH ? ((await permOk(false)) ? 'ok' : 'need') : 'none';
      updateAb();
      if (abState === 'ok') autoBackupNow(false);
    }
    async function chooseFolder() {
      if (!FS_OK) { alert('Auto backup to a folder needs Google Chrome or Microsoft Edge on a PC.'); return; }
      try {
        const h = await window.showDirectoryPicker({ id: 'evobill', mode: 'readwrite' });
        dirH = h; await idb('readwrite', function (st) { return st.put(h, 'dir'); });
        abState = 'ok'; await autoBackupNow(true);
      } catch (e) {
        if (e && e.name !== 'AbortError') alert('Could not use this folder.\n\nChrome does not allow Desktop, Documents or Downloads themselves. Create a new folder (for example D:\\EVO BILL BACKUP) and choose that.\n\n' + e);
      }
      updateAb();
    }
    async function allowAb() { if (await permOk(true)) await autoBackupNow(true); else { abState = 'need'; updateAb(); } }
    async function writeFile(name, text) { const dd = await coDir(), fh = await dd.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(text); await w.close(); }
    async function autoBackupNow(manual) {
      if (!dirH) return false;
      if (!(await permOk(manual))) { abState = 'need'; updateAb(); return false; }
      if (abBusy) return false;
      abBusy = true;
      try {
        db.lastBackup = new Date().toISOString();
        try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { }
        const text = JSON.stringify(db, null, 1);
        await writeFile('EvoBill_AutoBackup_LATEST.json', text);
        await writeFile('EvoBill_Backup_' + today() + '.json', text);
        const names = [], dd = await coDir();
        for await (const ent of dd.entries()) if (/^EvoBill_Backup_\d{4}-\d{2}-\d{2}\.json$/.test(ent[0])) names.push(ent[0]);
        names.sort(); while (names.length > 30) await dd.removeEntry(names.shift());
        abState = 'ok'; abLast = new Date(); abErr = '';
        return true;
      } catch (e) { abState = 'error'; abErr = String(e); return false; }
      finally { abBusy = false; updateAb(); }
    }
    function scheduleAb() { if (!dirH || abState === 'none') return; clearTimeout(abTimer); abTimer = setTimeout(function () { autoBackupNow(false); }, 3000); }
    function abHtml() {
      const nm = dirH ? esc(dirH.name || 'selected folder') : '';
      if (abState === 'nosupport') return '<span class="neg" style="color:var(--red)">Not supported in this browser.</span> Open EVO BILL in Google Chrome or Microsoft Edge on a PC.';
      if (abState === 'none') return 'No folder chosen yet. Click <b>Choose backup folder</b> and pick a folder on your PC (for example <b>D:\\EVO BILL BACKUP</b>).';
      if (abState === 'need') return '<b style="color:var(--accent2)">Folder: ' + nm + '</b> - the browser needs your permission again. Click <b>Allow access</b>.';
      if (abState === 'error') return '<b style="color:var(--red)">Backup failed:</b> ' + esc(abErr) + '. Click <b>Allow access</b> or choose the folder again.';
      return '<b class="neg">Auto backup is ON</b> - folder: <b>' + nm + '</b>. Every change is saved there within a few seconds' + (abLast ? ' (last saved ' + abLast.toLocaleTimeString() + ')' : '') + '. A copy for each day is kept for 30 days.';
    }
    function updateAb() {
      const e = $('#abStat'); if (e) e.innerHTML = abHtml();
      const p = $('#abPill'); if (!p) return;
      if (abState === 'ok') { p.className = 'abpill ok'; p.innerHTML = '&#10004; Auto backup ON'; p.onclick = function () { go('settings'); }; }
      else if (abState === 'need' || abState === 'error') { p.className = 'abpill warn'; p.innerHTML = '&#9888; Backup paused - click to allow'; p.onclick = allowAb; }
      else { p.className = 'abpill off'; p.innerHTML = '&#128193; Set backup folder'; p.onclick = function () { go('settings'); }; }
    }
    async function backup() {
      if (dirH && (await autoBackupNow(true))) { alert('Backup saved in your backup folder "' + (dirH.name || '') + '".'); if (view === 'dashboard' || view === 'settings') render(); return; }
      db.lastBackup = new Date().toISOString(); save();
      download('EvolutionBillBook_' + safeName(db.settings.shop || 'Company') + '_Backup_' + stamp() + '.json', JSON.stringify(db, null, 1));
      if (view === 'dashboard' || view === 'settings') render();
    }
    async function restoreFromFolder() {
      if (!dirH) { alert('Choose a backup folder first.'); return; }
      if (!(await permOk(true))) { alert('Permission for the folder was not given.'); return; }
      const list = [];
      try { const dd = await coDir(); for await (const ent of dd.entries()) if (ent[1].kind === 'file' && /^Evo.*\.json$/i.test(ent[0])) { const f = await ent[1].getFile(); list.push({ n: ent[0], t: f.lastModified, z: f.size }); } }
      catch (e) { alert('Could not read the folder: ' + e); return; }
      list.sort(function (a, b) { return b.t - a.t; });
      if (!list.length) { alert('No backup files found in this folder.'); return; }
      openModal('<h3>Restore from backup folder - ' + esc(db.settings.shop) + '</h3><p class="muted">Pick a backup. It will REPLACE all current data of this company. A safety copy of the current data is saved in the same folder first.</p>' +
        '<div style="max-height:55vh;overflow:auto">' + list.map(function (x) { return '<div class="bar" style="margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:8px"><span class="grow"><b>' + esc(x.n) + '</b><br><small class="muted">' + new Date(x.t).toLocaleString() + ' - ' + Math.round(x.z / 1024) + ' KB</small></span><button class="btn sm g" onclick="restoreName(\'' + esc(x.n) + '\')">Restore</button></div>'; }).join('') + '</div>' +
        '<div class="actions"><button class="btn l" onclick="closeModal();restoreFile()">Pick a file from elsewhere</button><button class="btn l" onclick="closeModal()">Close</button></div>');
    }
    async function restoreName(n) {
      try {
        const d = JSON.parse(await (await (await (await coDir()).getFileHandle(n)).getFile()).text());
        if (!d || d.app !== APPID || !Array.isArray(d.invoices) || !Array.isArray(d.customers)) { alert('This is not a valid Evolution Bill Book backup file.'); return; }
        if (!confirm('Restore "' + n + '"?\nThis REPLACES all current data.')) return;
        await writeFile('EvoBill_SafetyBeforeRestore_' + stamp() + '.json', JSON.stringify(db, null, 1));
        db = mergeDb(d); save(); closeModal(); go('dashboard'); alert('Restore completed.');
      } catch (e) { alert('Restore failed: ' + e); }
    }
    function restorePick() { if (dirH) restoreFromFolder(); else restoreFile(); }
    function restoreFile() { $('#restoreFile').value = ''; $('#restoreFile').click(); }
    $('#restoreFile').addEventListener('change', function () {
      const f = this.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = function () {
        try {
          const d = JSON.parse(r.result);
          if (!d || d.app !== APPID || !Array.isArray(d.invoices) || !Array.isArray(d.customers)) { alert('This is not a valid Evolution Bill Book backup file.'); return; }
          if (!confirm('Restore will REPLACE all current data with this backup.\nA safety copy of current data will download first.\n\nContinue?')) return;
          download('SafetyBackup_BeforeRestore_' + stamp() + '.json', JSON.stringify(db, null, 1));
          db = mergeDb(d); save(); go('dashboard'); alert('Restore completed.');
        } catch (e) { alert('Restore failed: ' + e); }
      };
      r.readAsText(f);
    });

    /* ============ Start ============ */
    $('#modal').addEventListener('mousedown', function (e) { if (e.target === this) { /* keep open on outside click to avoid losing data */ } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });
    render();
    loadDir();
  </script>
</body>

</html>
